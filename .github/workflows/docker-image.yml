name: Docker image

# Builds the image, proves it runs, then publishes it for amd64 and arm64. Release.yml and
# PreRelease.yml call this and decide the tags.
#
# The SDK stage of the Dockerfile runs natively and cross-publishes, and the final stage has no RUN,
# so arm64 needs neither QEMU nor an arm64 runner.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Image tag, e.g. 4.7.0 or feature-x'
        required: true
        type: string
      latest:
        description: 'Also move the latest tag'
        required: false
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/xian55/hermesproxy

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository content
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # .git is the build context, so the token must not stay in its config.
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: hermesproxy:smoke

      - name: Smoke test
        run: bash scripts/docker-smoke.sh hermesproxy:smoke

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}
            ${{ inputs.latest && format('{0}:latest', env.IMAGE) || '' }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
